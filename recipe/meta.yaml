{% set name = "tafra" %}
{% set version = "2.3.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  # sha256 will be filled by conda-forge bot after PyPI upload

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}      # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
  host:
    - python
    - pip
    - setuptools >=64
    - numpy >=2.1
  run:
    - python
    - numpy >=2.1
    - typing_extensions

test:
  source_files:
    - test
  imports:
    - tafra
    - tafra._accel
  commands:
    - pip check
    - python -c "from tafra._accel import groupby_sum; print('C extension OK')"
    # The C extension loaded with every kernel; on a free-threaded build
    # (Py_GIL_DISABLED) importing it must not re-enable the GIL
    - python -W error -c "import sys, sysconfig, tafra._kernels as k; assert k.HAS_ACCEL, 'C extension missing'; assert not sysconfig.get_config_var('Py_GIL_DISABLED') or not sys._is_gil_enabled()"
    - pytest --cov=tafra --cov-report=term-missing --hypothesis-show-statistics -v test
  requires:
    - pip
    - pytest
    - hypothesis
    - pytest-cov
    - pandas

about:
  home: https://github.com/petbox-dev/tafra
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Tafra: essence of a dataframe"
  description: |
    A minimalist Python dataframe library — a lightweight alternative to
    pandas backed by numpy arrays. Provides SQL-style group-by, transform,
    and join operations with optional C acceleration for grouped
    aggregation and hash-based equi-joins.
  doc_url: https://petbox-dev.github.io/tafra/
  dev_url: https://github.com/petbox-dev/tafra

extra:
  recipe-maintainers:
    - dsfulf
